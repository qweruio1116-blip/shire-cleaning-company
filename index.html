<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>シレのライフアドベンチャー</title><style>*{box-sizing:border-box}body{margin:0;background:#e8f1e5;color:#254b39;font:16px system-ui}main{max-width:480px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:10px;gap:8px}header{font-weight:bold;text-align:center}#stats{display:flex;gap:5px}#stats div{flex:1;background:white;border-radius:10px;padding:7px;text-align:center;font-size:12px}#stats b{display:block;font-size:20px}#field{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:18px;background:#bde4ec}canvas{width:100%;height:100%;display:block;touch-action:none}#cover{position:absolute;inset:0;background:#f5faeef5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px}button{background:#39784d;color:white;border:0;border-radius:12px;padding:14px 24px;font: bold 17px system-ui;cursor:pointer}p{margin:0;line-height:1.6}small{text-align:center}h1{font-size:25px;margin:0}#pause{padding:6px 12px;font-size:12px}footer{display:flex;justify-content:space-between;align-items:center}</style><main><header>シレのライフアドベンチャー</header><div id="stats"><div>金融資産<b id="a">0</b></div><div>人的資産<b id="b">0</b></div><div>社会的資産<b id="c">0</b></div></div><footer><span id="life">ライフ ♥♥♥</span><span id="time">0 / 60 秒</span><button id="pause">一時停止</button></footer><div id="field"><canvas id="cv"></canvas><div id="cover"><h1>シレの<br>ライフアドベンチャー</h1><p>空を飛びながら、人生を支える3つの資産を集めよう。</p><p>金融資産：お金<br>人的資産：知識・健康<br>社会的資産：仲間・信頼</p><p>アクシデントに注意！</p><button id="start">スタート</button><small>スマホ：指で左右に移動<br>PC：← → キー またはマウス</small></div></div><small>3つの資産をバランスよく育てよう</small></main><script>
const $=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d');let W=360,H=600,x=180,items=[],scores=[0,0,0],life=3,t=0,spawn=0,last=0,active=false,paused=false,keys={},inv=0,raf=0;const colors=['#e9b83e','#4b9fcb','#a777c7'],symbols=['¥','本','友'],names=['金融資産','人的資産','社会的資産'],hazards=['詐欺','事故','急な出費','病気'];function resize(){let r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);x=Math.max(25,Math.min(W-25,x));draw()}window.addEventListener('resize',resize);function circle(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}function shire(x,y){g.save();g.translate(x,y);g.strokeStyle='#59402d';g.lineWidth=2;g.fillStyle='#c8e78a';g.beginPath();g.ellipse(-21,9,17,10,-.5,0,7);g.ellipse(21,9,17,10,.5,0,7);g.fill();g.stroke();circle(0,12,19,'#397a46');circle(0,9,13,'#b8df65');for(let s of [-1,1]){g.beginPath();g.moveTo(s*12,-20);g.lineTo(s*19,-34);g.stroke();circle(s*19,-34,7,'#b8df65');circle(s*21,-36,2,'white')}circle(0,-8,24,'#b8df65');g.beginPath();g.arc(0,-8,24,0,7);g.stroke();circle(-9,-11,3,'#59402d');circle(9,-11,3,'#59402d');circle(-1,-3,7,'#66a64d');for(let s of [-1,1])for(let j=0;j<3;j++){g.strokeStyle='#df8845';g.beginPath();g.moveTo(s*14+j-1,0);g.lineTo(s*14+j-3,4);g.stroke()}['#e87e75','#e7c45c','#729ecb','#a47bb8'].forEach((c,i)=>{g.fillStyle=c;g.fillRect(-16+i*8,14,8,6)});g.restore()}function draw(){g.fillStyle='#bde4ec';g.fillRect(0,0,W,H);for(let i=0;i<8;i++){let yy=(i*107+t*35)%(H+100)-50,xx=(i*137)%W;circle(xx,yy,23,'#eaf7f5');circle(xx+22,yy+5,17,'#eaf7f5')}for(const o of items){circle(o.x,o.y,23,o.k<3?colors[o.k]:'#d16b61');g.fillStyle='white';g.textAlign='center';g.font='bold '+(o.k<3?22:12)+'px system-ui';g.fillText(o.k<3?symbols[o.k]:o.label,o.x,o.y+5)}if(inv<=0||Math.floor(inv*10)%2===0)shire(x,H-65)}function hud(){['a','b','c'].forEach((id,i)=>$(id).textContent=scores[i]);$('life').textContent='ライフ '+ '♥'.repeat(life)+'♡'.repeat(3-life);$('time').textContent=Math.floor(t)+' / 60 秒'}function loop(now){if(!active||paused)return;let dt=last?Math.min(.04,(now-last)/1000):0;last=now;t+=dt;inv=Math.max(0,inv-dt);x+=((keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0))*250*dt;x=Math.max(26,Math.min(W-26,x));spawn-=dt;if(spawn<=0){spawn=.48+Math.random()*.3;let k=Math.random()<.26?3:Math.floor(Math.random()*3);items.push({x:28+Math.random()*(W-56),y:-25,k,label:hazards[Math.floor(Math.random()*hazards.length)]})}for(let o of items){o.y+=(125+t*1.7)*dt;if(Math.hypot(o.x-x,o.y-(H-65))<39){o.dead=true;if(o.k<3)scores[o.k]++;else if(!inv){life--;inv=1.2}}}items=items.filter(o=>!o.dead&&o.y<H+30);hud();draw();if(life<=0||t>=60){finish();return}raf=requestAnimationFrame(loop)}function finish(){active=false;let total=scores.reduce((a,b)=>a+b,0),balance=Math.min(...scores)*3;$('cover').innerHTML=`<h1>${life?'ゴール！':'旅はここまで'}</h1><p>金融資産 ${scores[0]}<br>人的資産 ${scores[1]}<br>社会的資産 ${scores[2]}</p><h2>総合スコア ${total+balance}</h2><p>獲得 ${total} ＋ バランスボーナス ${balance}</p><p>お金だけでなく、知識や健康、人とのつながりも人生を支える資産です。</p><button id="again">もう一度</button>`;$('cover').style.display='flex';$('again').onclick=start}function start(){cancelAnimationFrame(raf);scores=[0,0,0];life=3;t=0;spawn=0;items=[];x=W/2;last=0;inv=0;active=true;paused=false;$('pause').textContent='一時停止';$('cover').style.display='none';hud();raf=requestAnimationFrame(loop)}$('start').onclick=start;$('pause').onclick=()=>{if(!active)return;paused=!paused;$('pause').textContent=paused?'再開':'一時停止';if(paused)cancelAnimationFrame(raf);else{last=0;raf=requestAnimationFrame(loop)}};window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){e.preventDefault();keys[e.key]=true}});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>keys={});function move(e){if(active&&!paused)x=e.clientX-cv.getBoundingClientRect().left}cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);move(e)});cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)move(e)});resize();</script></html>
