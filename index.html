<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シレのおそうじカンパニー</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3e8;color:#243b2c;font:16px system-ui}main{max-width:760px;margin:auto;padding:16px}header{background:#286342;color:white;padding:16px;text-align:center;font-weight:bold}section{background:white;border:1px solid #d5e2d1;border-radius:14px;padding:16px;margin:12px 0}button,input,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #b9cbb9}button{background:#286342;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.4}input,select{max-width:100%}h2,h3{margin:0 0 12px}small{color:#586d5e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#edf3e8;padding:12px;border-radius:9px}.metric b{display:block;font-size:21px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}td:last-child{text-align:right}canvas{width:100%;height:auto;touch-action:none;background:#e8d8ba;border-radius:10px;display:block}label{display:block;margin:8px 0}#msg{color:#875520}button.secondary{background:#fff;color:#286342} @media(max-width:380px){main{padding:8px}.metric b{font-size:17px}}</style></head><body><header>シレのおそうじカンパニー</header><main id="app"><section><h2>街をきれいに、会社を大きく。</h2><p>掃除に困っている人を助けたいシレは、貯金100万円で会社を設立することにしました。</p><label>会社名 <input id="company" value="シレ株式会社" maxlength="30"></label><button onclick="start()">会社を設立する</button><button class="secondary" onclick="resume()">つづきから</button><p id="msg"></p><small>試作版・金額や融資条件は架空です。</small></section></main><script>window.addEventListener("error",function(e){var m=document.getElementById("msg");if(m)m.textContent="読み込みエラー："+e.message;});</script><script>
const $=id=>document.getElementById(id), app=$('app'), yen=n=>Math.round(n).toLocaleString('ja-JP')+'円', key='shire-cleaning-v1';let s, timer, job, spots=[], deadline=0, active=false;const equipmentList=[{name:'雑巾・ブラシセット',price:20000,power:1},{name:'業務用掃除機',price:180000,power:2},{name:'高圧洗浄機',price:450000,power:3},{name:'大型洗浄機',price:1100000,power:5}];const jobs=[{name:'個人宅の床清掃',pay:45000,cost:5000,count:22,req:0},{name:'浴室・キッチン清掃',pay:95000,cost:10000,count:38,req:1},{name:'空室の一括清掃',pay:180000,cost:20000,count:55,req:2},{name:'大型施設の清掃',pay:320000,cost:35000,count:80,req:3}];function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function start(){let name=$('company').value.trim()||'シレ株式会社';s={name,month:1,cash:1000000,capital:1000000,assets:0,loans:[],owned:[],profit:0,retained:0,rev:0,exp:0,done:0,history:[],journal:[]};entry('普通預金','資本金',1000000);save();home()}function entry(d,c,n){if(n)s.journal.push({m:s.month,d,c,n})}function expense(n,account){s.cash-=n;s.exp+=n;s.profit-=n;entry(account,'普通預金',n)}function debt(){return s.loans.reduce((a,l)=>a+l.left,0)}function showTitle(){app.innerHTML=`<section><h2>街をきれいに、会社を大きく。</h2><p>掃除に困っている人を助けたいシレは、貯金100万円で会社を設立することにしました。</p><label>会社名 <input id="company" value="シレ株式会社" maxlength="30"></label><button onclick="start()">会社を設立する</button><button class="secondary" onclick="resume()">つづきから</button><p id="msg"></p><small>試作版・金額や融資条件は架空です。</small></section>`}function resume(){try{s=JSON.parse(localStorage.getItem(key));if(s){home();return}}catch(e){}$('msg').textContent='セーブデータがありません'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function top(){return `<section><h3>${esc(s.name)}　第${Math.ceil(s.month/12)}期 ${((s.month-1)%12)+1}か月目</h3><div class="grid"><div class="metric">普通預金<b>${yen(s.cash)}</b></div><div class="metric">借入金<b>${yen(debt())}</b></div><div class="metric">当期利益<b>${yen(s.profit)}</b></div><div class="metric">今月の受注<b>${s.done}/4件</b></div></div></section>`}function home(msg=''){save();app.innerHTML=top()+`<section><h2>経営メニュー</h2><p id="msg">${msg}</p><div class="grid"><button onclick="work()">仕事を受注</button><button onclick="shop()">設備購入</button><button onclick="loan()">融資相談</button><button onclick="finance()">財務諸表</button></div><button onclick="closeMonth()">今月の営業を終了</button><button class="secondary" onclick="showTitle()">タイトルへ</button></section><section><small>機材を強化すると高単価の仕事が受注でき、汚れを落としやすくなります。毎月固定費2万円と返済が発生します。</small></section>`}function shop(){app.innerHTML=top()+`<section><h2>設備購入</h2>${equipmentList.map((t,i)=>`<p><b>${t.name}</b> ${yen(t.price)}<br><small>清掃力 ${t.power}</small> <button ${s.owned.includes(i)||s.cash<t.price?'disabled':''} onclick="buy(${i})">${s.owned.includes(i)?'購入済':'購入'}</button></p>`).join('')}<button onclick="home()">戻る</button></section>`}function buy(i){let t=equipmentList[i];if(s.owned.includes(i)||s.cash<t.price)return;s.cash-=t.price;s.assets+=t.price;s.owned.push(i);entry('工具器具備品','普通預金',t.price);save();shop()}function loan(){app.innerHTML=top()+`<section><h2>融資相談</h2><label>借入額 <input id="amt" type="number" min="10000" max="3000000" step="10000" value="500000" oninput="quote()"></label><label>期間 <select id="term" onchange="quote()"><option>6</option><option>12</option><option>36</option><option>60</option></select> か月</label><label>返済方法 <select id="method" onchange="quote()"><option value="split">元金均等返済</option><option value="bullet">満期一括返済（利息毎月）</option></select></label><p>年利3%（仮定）</p><p id="quote"></p><button onclick="borrow()">借り入れる</button><button onclick="home()">戻る</button><small>試作版では借入残高上限300万円。実際の融資審査とは異なります。</small></section>`;quote()}function quote(){let a=+$('amt').value,n=+$('term').value,b=$('method').value==='bullet',r=.03/12;$('quote').textContent='初月返済額 '+yen(a*r+(b?0:a/n))+' ／ 利息総額（概算） '+yen(a*r*(b?n:(n+1)/2))}function borrow(){let a=+$('amt').value,n=+$('term').value;if(!Number.isInteger(a)||a<10000||a+debt()>3000000){alert('借入額を確認してください');return}s.cash+=a;s.loans.push({left:a,original:a,n,remaining:n,method:$('method').value});entry('普通預金','借入金',a);home('融資を受けました。返済計画を確認しましょう。')}function work(){app.innerHTML=top()+`<section><h2>仕事を受注</h2>${jobs.map((j,i)=>`<p><b>${j.name}</b><br>報酬 ${yen(j.pay)} ／ 消耗品 ${yen(j.cost)}<br><button ${s.done>=4||!s.owned.includes(j.req)||s.cash<j.cost?'disabled':''} onclick="play(${i})">受注する</button><small>必要機材：${equipmentList[j.req].name}</small></p>`).join('')}<button onclick="home()">戻る</button></section>`}function play(i){if(active||s.done>=4||!s.owned.includes(jobs[i].req)||s.cash<jobs[i].cost)return;job=jobs[i];expense(job.cost,'消耗品費');s.done++;save();active=true;spots=Array.from({length:job.count},()=>({x:25+Math.random()*550,y:25+Math.random()*350,r:10+Math.random()*13,h:2+Math.floor(Math.random()*3)}));app.innerHTML=`<section><h2>${job.name}</h2><p id="status"></p><canvas id="cv" width="600" height="400"></canvas><p>汚れを指やマウスでなぞって掃除しよう。</p><button onclick="finish()">作業終了</button></section>`;let cv=$('cv');let down=false;function clean(e){if(!active)return;let b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*600/b.width,y=(e.clientY-b.top)*400/b.height,p=Math.max(...s.owned.map(i=>equipmentList[i].power));for(let z of spots)if(z.h>0&&Math.hypot(z.x-x,z.y-y)<z.r+12+p*5)z.h-=p;draw();if(spots.every(z=>z.h<=0))finish()}cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);clean(e)};cv.onpointermove=e=>{if(down)clean(e)};cv.onpointerup=cv.onpointercancel=()=>down=false;deadline=Date.now()+30000;timer=setInterval(()=>{if(Date.now()>=deadline)finish();else draw()},100);draw()}function draw(){if(!active)return;let c=$('cv').getContext('2d');c.fillStyle='#e8d8ba';c.fillRect(0,0,600,400);c.strokeStyle='#c6b79d';for(let x=0;x<600;x+=75){c.beginPath();c.moveTo(x,0);c.lineTo(x,400);c.stroke()}for(let y=0;y<400;y+=80){c.beginPath();c.moveTo(0,y);c.lineTo(600,y);c.stroke()}for(let z of spots){if(z.h<=0)continue;c.fillStyle='#806047';c.beginPath();c.arc(z.x,z.y,z.r,0,7);c.fill();c.fillStyle='#a38461';c.beginPath();c.arc(z.x-3,z.y-3,z.r*.55,0,7);c.fill()}$('status').textContent='残り '+Math.max(0,Math.ceil((deadline-Date.now())/1000))+'秒 ／ 清掃 '+spots.filter(z=>z.h<=0).length+'/'+spots.length}function finish(){if(!active)return;active=false;clearInterval(timer);let ratio=spots.filter(z=>z.h<=0).length/spots.length,n=Math.round(job.pay*ratio);s.cash+=n;s.rev+=n;s.profit+=n;entry('普通預金','売上高',n);home('清掃完了率 '+Math.round(ratio*100)+'% ／ 売上 '+yen(n))}function bs(){return `<h3>貸借対照表</h3><table><tr><th>資産</th><th>金額</th></tr><tr><td>普通預金</td><td>${yen(s.cash)}</td></tr><tr><td>工具器具備品（簿価）</td><td>${yen(s.assets)}</td></tr><tr><th>資産合計</th><th>${yen(s.cash+s.assets)}</th></tr><tr><td>借入金</td><td>${yen(debt())}</td></tr><tr><td>資本金</td><td>${yen(s.capital)}</td></tr><tr><td>利益剰余金（当期含む）</td><td>${yen(s.retained+s.profit)}</td></tr><tr><th>負債・純資産合計</th><th>${yen(debt()+s.capital+s.retained+s.profit)}</th></tr></table>`}function pl(){return `<h3>損益計算書</h3><table><tr><td>売上高</td><td>${yen(s.rev)}</td></tr><tr><td>費用合計</td><td>${yen(s.exp)}</td></tr><tr><th>当期純利益（税省略）</th><th>${yen(s.profit)}</th></tr></table>`}function finance(){app.innerHTML=top()+`<section>${bs()}<h3>借入明細</h3>${s.loans.map(l=>`<p>残高 ${yen(l.left)} ／ 残り${l.remaining}か月</p>`).join('')||'借入なし'}<h3>仕訳帳（直近20件）</h3><table><tr><th>借方</th><th>貸方</th><th>金額</th></tr>${s.journal.slice(-20).reverse().map(j=>`<tr><td>${j.d}</td><td>${j.c}</td><td>${yen(j.n)}</td></tr>`).join('')}</table><button onclick="home()">戻る</button></section>`}function closeMonth(){let fixed=20000,interest=s.loans.reduce((a,l)=>a+Math.round(l.left*.03/12),0),principal=s.loans.reduce((a,l)=>a+(l.remaining===1?l.left:l.method==='split'?Math.min(l.left,Math.round(l.original/l.n)):0),0);if(s.cash<fixed+interest+principal){home('資金不足：月末支払に '+yen(fixed+interest+principal)+' 必要です。追加融資や営業を検討してください。');return}expense(fixed,'諸経費');expense(interest,'支払利息');for(let l of s.loans){let p=l.remaining===1?l.left:l.method==='split'?Math.min(l.left,Math.round(l.original/l.n)):0;l.left-=p;l.remaining--;s.cash-=p;entry('借入金','普通預金',p)}s.loans=s.loans.filter(l=>l.left>0);let dep=Math.min(s.assets,Math.round(s.owned.reduce((a,i)=>a+equipmentList[i].price/60,0)));s.assets-=dep;s.exp+=dep;s.profit-=dep;entry('減価償却費','工具器具備品',dep);let annual=s.month%12===0,report=bs()+(annual?pl():'');s.history.push({month:s.month,cash:s.cash,debt:debt(),assets:s.assets,profit:s.profit});if(annual){s.retained+=s.profit;s.profit=0;s.rev=0;s.exp=0}s.month++;s.done=0;save();app.innerHTML=`<section><h2>${annual?'年度':'月次'}決算</h2><p>固定費 ${yen(fixed)} ／ 元金返済 ${yen(principal)} ／ 利息 ${yen(interest)}</p>${report}<button onclick="home()">翌月へ</button></section>`}showTitle();</script></body></html>
